[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "grounding-pi-rejection-lab"
version = "0.0.1"
description = "Data and evaluation preparation for missing-target rejection research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["rejection_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
